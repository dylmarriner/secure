[workspace]
resolver = "2"
members = [
    "crates/secure-core",
    "crates/secure-crypto",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
rand_core = { version = "0.10.1", features = ["getrandom"] }
sha2 = "0.10.9"
thiserror = "2"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
