[workspace]
resolver = "2"
members = [
    "crates/secure-attachments",
    "crates/secure-core",
    "crates/secure-crypto",
    "crates/secure-messaging",
    "crates/secure-storage",
    "crates/secure-transport",
]
exclude = ["apps/desktop/src-tauri", "fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.10.1"
hkdf = "0.13.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = "0.11.0"
thiserror = "2"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
