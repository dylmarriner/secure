name: Integration security (live Tor)

# Live-network tests run only on trusted manual/scheduled triggers, never on PRs.
# PRs that modify security parsers or this workflow get a short no-network fuzz smoke test;
# weekly/manual runs keep the full 15-minute fuzz duration. No repository secrets are used.
# docs/security-remediation-plan.md R8.
#
# Not covered here yet: the SimpleX two-client round trip and kill-the-SOCKS-bridge tests need
# the simplex-native core built from source (scripts/build-simplex-native.sh, GHC 9.6 + cabal,
# ~1h) and packet capture needs a dedicated host; see R4/R9.

on:
  pull_request:
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/integration-security.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  live-tor:
    name: Live Tor bootstrap and SOCKS shutdown
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Live Tor tests
        run: cargo test --locked -p secure-transport --test live_bootstrap -- --ignored --nocapture

  fuzz:
    name: Fuzz persistent/untrusted parsers (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [svk1_envelope, satt_decrypt, simplex_events]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@0.13.2
      - name: Install sanitizer-compatible GNU target
        run: rustup target add x86_64-unknown-linux-gnu --toolchain nightly
      - name: Fuzz parsers (30s smoke on PR, 15m on scheduled/manual runs)
        working-directory: fuzz
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '30' || '900' }}
        # Explicitly avoid the musl target: address sanitizer cannot link against static libc.
        run: cargo +nightly fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time="$FUZZ_SECONDS"
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
