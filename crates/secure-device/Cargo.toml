[package]
name = "secure-device"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rand_core.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = { version = "7.7", optional = true }

[features]
# Linux TPM 2.0 backend (tpm2-tss system libraries, /dev/tpmrm0 or a TCTI from the environment).
# A no-op on other platforms, whose builds therefore fail closed through UnavailableStore.
tpm = ["dep:tss-esapi"]
# In-memory store for tests only. Never enable in a shipped build: it keeps the "device" secret
# in process memory, so it provides no anti-rollback property at all.
test-store = []

[dev-dependencies]
tempfile = "3"
