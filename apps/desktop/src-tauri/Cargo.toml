[package]
name = "secure-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
secure-core = { path = "../../../crates/secure-core" }
secure-crypto = { path = "../../../crates/secure-crypto" }
secure-storage = { path = "../../../crates/secure-storage" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
zeroize = { version = "1.9", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3"
